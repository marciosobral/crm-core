services:
  - type: web
    name: crm-core-api
    runtime: docker
    region: virginia
    plan: free
    autoDeployTrigger: "off"
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: SEED_DEMO_PASSWORD
        sync: false
      - key: SEED_SELLER_PASSWORD
        sync: false
